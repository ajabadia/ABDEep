        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DDEEP_TARGET_MODEL=2 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ runner.temp }}/wv2"

      - name: Build ABDEep_Benchmarks target
        run: |
          cmake --build build --config Release --target ABDEep_Benchmarks

      - name: Run full benchmark (18 scenarios, 3 repeats, best-p95)
        shell: bash
        run: |
          set -o pipefail
          {
            echo "# ABDEep processBlock benchmark — CI windows-2022 (dedicated runner)"
            echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH cpus=$NUMBER_OF_PROCESSORS"
            echo "commit=$(git rev-parse --short HEAD) timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > bench_meta.txt
          ./build/ABDEep_Benchmarks_artefacts/Release/ABDEep_Benchmarks.exe > bench_full.log 2>&1
          echo "benchmark exit=$?"
          grep -E '^(RESULT|BEST|BENCH_DONE)' bench_full.log > bench_results.txt
          grep -q '^BENCH_DONE' bench_full.log || {
            echo "::error::BENCH_DONE no encontrado — benchmark incompleto"
            cat bench_full.log
            exit 1
          }
          echo "::group::Benchmark results"
          cat bench_meta.txt
          cat bench_results.txt
          echo "::endgroup::"
          cat bench_results.txt >> "$GITHUB_STEP_SUMMARY"

      # Publica los resultados como artefacto de Actions (usa el token runtime
      # del runner — sin permisos extra; el push de una rama con .github/workflows/*
      # exigiria workflows:write, que GitHub rechaza en este repo).
      - name: Publish benchmark results (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            bench_meta.txt
            bench_results.txt
            bench_full.log
          if-no-files-found: error
          retention-days: 90
