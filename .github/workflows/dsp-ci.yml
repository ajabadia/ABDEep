name: DSP C++ CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Source/**"
      - "CMakeLists.txt"
      - "build.bat"
      - ".github/workflows/dsp-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Source/**"
      - "CMakeLists.txt"
      - "build.bat"
      - ".github/workflows/dsp-ci.yml"

permissions:
  contents: read

concurrency:
  group: dsp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Run C++ Unit Tests
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch JUCE 8.0.12 (no submodule; CMake falls back to ./JUCE)
        shell: bash
        run: |
          if [ ! -d JUCE ]; then
            git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git JUCE
          fi
          echo "JUCE at: $PWD/JUCE"

      - name: Fetch WebView2 SDK (juce_add_plugin exige find_package(WebView2) al configurar)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/wv2/Microsoft.Web.WebView2.1.0.3800.47" | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.3800.47" -OutFile "$env:RUNNER_TEMP/wv2/pkg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/wv2/pkg.zip" -DestinationPath "$env:RUNNER_TEMP/wv2/Microsoft.Web.WebView2.1.0.3800.47" -Force
          Write-Host "WebView2 SDK listo en $env:RUNNER_TEMP/wv2"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # windows-2022 ya trae LLVM en el PATH (C:\Program Files\LLVM\bin), asi que
      # clang-format NO hace falta instalarlo. La orden anterior
      #   choco install clang-format cppcheck --version=18.1.8 --version=2.14.0 -y
      # fallaba SIEMPRE: en Chocolatey no existe paquete `clang-format` (el que lo
      # trae es `llvm`), `cppcheck 2.14.0` no existe (hay 2.16.0 y 2.19.0) y los dos
      # flags --version de la misma orden se pisan entre si. El log de CI decia
      # "Chocolatey installed 0/2 packages. 2 packages failed." y los tres jobs se
      # caian en el paso 6, sin llegar nunca al build ni a los tests C++.
      - name: Install cppcheck (clang-format ya viene en la imagen)
        run: |
          choco install cppcheck --version=2.16.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Chocolatey no pudo instalar cppcheck 2.16.0"
            exit 1
          }
          if (Get-Command clang-format -ErrorAction SilentlyContinue) {
            Write-Host "clang-format -> $(& clang-format --version)"
          } else {
            Write-Host "::warning title=clang-format::No hay clang-format en el PATH de la imagen; el chequeo de formato se omite."
          }
          # El MSI lo instala en C:\Program Files\Cppcheck y choco actualiza la
          # PATH de la maquina, que este proceso NO vuelve a leer -- lo dice el
          # propio log: "Environment Vars (like PATH) have changed. Close/reopen
          # your shell to see the changes". Sin esto el paso de cppcheck no
          # encuentra el binario aunque la instalacion haya ido bien.
          $dir = 'C:\Program Files\Cppcheck'
          $exe = Join-Path $dir 'cppcheck.exe'
          if (-not (Test-Path $exe)) {
            $hit = Get-ChildItem -Path $dir -Filter cppcheck.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $exe = $hit.FullName; $dir = $hit.DirectoryName }
          }
          if (-not (Test-Path $exe)) {
            Write-Host "::error::cppcheck 2.16.0 se instalo pero no se encuentra cppcheck.exe bajo $dir"
            exit 1
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "cppcheck     -> $(& $exe --version)"

      # Gate de formato INFORMATIVO (no bloqueante). Con el .clang-format ya valido
      # --tenia tres errores de parseo: SpaceBeforeParens duplicado,
      # ReferenceBindsToType desconocida y Standard: Cpp20, los tres con el mismo
      # efecto "Error reading ...: invalid argument", o sea abortaba en TODOS los
      # ficheros--, 243 de 245 ficheros de Source/ fallarian: 33.674 lineas. Aun
      # acotado a las lineas que toca este PR serian 113 ficheros / 8.293 lineas.
      # El gate nunca llego a correr en su historia, asi que esa deuda es
      # acumulada y no una discusion de estilo puntual. Se emite una anotacion
      # ::warning con el recuento y el paso sale siempre con 0, para que el valor
      # real de este job (cppcheck + build + tests C++) deje de quedar bloqueado
      # por ella. El reformato se aborda en un PR dedicado.
      #
      # El listado sale de `git ls-files` porque el shell por defecto en Windows
      # es pwsh y NO expande `Source/**/*.h`: clang-format recibia la ruta literal
      # y reventaba con "invalid argument".
      - name: Check formatting (clang-format) - informativo, no bloqueante
        shell: bash
        run: |
          set +e
          if ! command -v clang-format >/dev/null 2>&1; then
            echo "::warning title=clang-format::No hay clang-format en el PATH: se omite el chequeo de formato."
            exit 0
          fi
          mapfile -t ficheros < <(git ls-files 'Source/*.h' 'Source/*.cpp' 'Source/*.hpp' 'Source/*.mm')
          echo "clang-format: $(clang-format --version) sobre ${#ficheros[@]} ficheros"
          salida=$(printf '%s\0' "${ficheros[@]}" | xargs -0 clang-format --dry-run --Werror 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "clang-format: sin incidencias en ${#ficheros[@]} ficheros."
          else
            printf '%s\n' "$salida" | sed -n '1,30p'
            avisos=$(printf '%s\n' "$salida" | grep -c 'should be clang-formatted' || true)
            echo "::warning title=clang-format::${avisos} avisos de formato en Source/ sobre ${#ficheros[@]} ficheros revisados. Deuda historica: gate informativo hasta el PR de reformato."
          fi
          exit 0

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,performance,portability --std=c++20 --suppress=missingIncludeSystem Source/

      - name: Configure CMake (model 2 — Enhanced, full test coverage)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DDEEP_TARGET_MODEL=2 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ runner.temp }}/wv2"

      - name: Build Unit Tests target
        run: |
          cmake --build build --config Release --target ABDEep_UnitTests

      - name: Run C++ Unit Tests
        run: |
          .\build\ABDEep_UnitTests_artefacts\Release\ABDEep_UnitTests.exe
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # Allocation audit — Invariante de tiempo real §3.1 del plan v3.2:
  # processBlock() debe ejecutarse con CERO asignaciones dinámicas en TODA la
  # configuración. Blindaje: idle (ruta mínima), poly12 (12 voces) y max_all
  # (Uni12 + modmatrix 32 + Moog 4x + 4 FX r.9). Falla si allocs > 0 en cualquiera.
