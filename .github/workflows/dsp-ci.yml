          $exe = Join-Path $dir 'cppcheck.exe'
          if (-not (Test-Path $exe)) {
            $hit = Get-ChildItem -Path $dir -Filter cppcheck.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $exe = $hit.FullName; $dir = $hit.DirectoryName }
          }
          if (-not (Test-Path $exe)) {
            Write-Host "::error::cppcheck 2.16.0 se instalo pero no se encuentra cppcheck.exe bajo $dir"
            exit 1
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "cppcheck     -> $(& $exe --version)"

      # Gate de formato INFORMATIVO (no bloqueante). Con el .clang-format ya valido
      # --tenia tres errores de parseo: SpaceBeforeParens duplicado,
      # ReferenceBindsToType desconocida y Standard: Cpp20, los tres con el mismo
      # efecto "Error reading ...: invalid argument", o sea abortaba en TODOS los
      # ficheros--, 243 de 245 ficheros de Source/ fallarian: 33.674 lineas. Aun
      # acotado a las lineas que toca este PR serian 113 ficheros / 8.293 lineas.
      # El gate nunca llego a correr en su historia, asi que esa deuda es
      # acumulada y no una discusion de estilo puntual. Se emite una anotacion
