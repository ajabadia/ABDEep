name: DSP C++ CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Source/**"
      - "CMakeLists.txt"
      - "build.bat"
      - ".github/workflows/dsp-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Source/**"
      - "CMakeLists.txt"
      - "build.bat"
      - ".github/workflows/dsp-ci.yml"

permissions:
  contents: read

concurrency:
  group: dsp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Run C++ Unit Tests
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch JUCE 8.0.12 (no submodule; CMake falls back to ./JUCE)
        shell: bash
        run: |
          if [ ! -d JUCE ]; then
            git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git JUCE
          fi
          echo "JUCE at: $PWD/JUCE"

      - name: Fetch WebView2 SDK (juce_add_plugin exige find_package(WebView2) al configurar)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/wv2/Microsoft.Web.WebView2.1.0.3800.47" | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.3800.47" -OutFile "$env:RUNNER_TEMP/wv2/pkg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/wv2/pkg.zip" -DestinationPath "$env:RUNNER_TEMP/wv2/Microsoft.Web.WebView2.1.0.3800.47" -Force
          Write-Host "WebView2 SDK listo en $env:RUNNER_TEMP/wv2"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Configure CMake (model 2 — Enhanced, full test coverage)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DDEEP_TARGET_MODEL=2 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ runner.temp }}/wv2"

      - name: Build Unit Tests target
        run: |
          cmake --build build --config Release --target ABDEep_UnitTests

      - name: Run C++ Unit Tests
        run: |
          .\build\ABDEep_UnitTests_artefacts\Release\ABDEep_UnitTests.exe
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # Allocation audit — Invariante de tiempo real §3.1 del plan v3.2:
  # processBlock() debe ejecutarse con CERO asignaciones dinámicas en TODA la
  # configuración. Blindaje: idle (ruta mínima), poly12 (12 voces) y max_all
  # (Uni12 + modmatrix 32 + Moog 4x + 4 FX r.9). Falla si allocs > 0 en cualquiera.
  # ────────────────────────────────────────────────────────────────────────────
  allocation-audit:
    name: Allocation audit — 0 allocs in idle/poly12/max_all
    runs-on: windows-2022
    timeout-minutes: 40

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch JUCE 8.0.12 (no submodule; CMake falls back to ./JUCE)
        shell: bash
        run: |
          if [ ! -d JUCE ]; then
            git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git JUCE
          fi
          echo "JUCE at: $PWD/JUCE"

      - name: Fetch WebView2 SDK (juce_add_plugin exige find_package(WebView2) al configurar)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/wv2/Microsoft.Web.WebView2.1.0.3800.47" | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.3800.47" -OutFile "$env:RUNNER_TEMP/wv2/pkg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/wv2/pkg.zip" -DestinationPath "$env:RUNNER_TEMP/wv2/Microsoft.Web.WebView2.1.0.3800.47" -Force
          Write-Host "WebView2 SDK listo en $env:RUNNER_TEMP/wv2"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Configure CMake (model 2 — Enhanced, full test coverage)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DDEEP_TARGET_MODEL=2 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ runner.temp }}/wv2"

      - name: Build ABDEep_Benchmarks target
        run: |
          cmake --build build --config Release --target ABDEep_Benchmarks

      - name: Run allocation audit (idle, poly12, max_all — 3 repeats each)
        shell: bash
        run: |
          set -o pipefail
          FAIL=0
          for s in idle poly12 max_all; do
            ./build/ABDEep_Benchmarks_artefacts/Release/ABDEep_Benchmarks.exe --scenario "$s" > "bench_${s}.log" 2>&1
            grep -q '^BENCH_DONE' "bench_${s}.log" || {
              echo "::error::benchmark ${s} incompleto (sin BENCH_DONE)"
              FAIL=1
              continue
            }
            echo "[audit] BEST lines de ${s}:"
            grep '^BEST' "bench_${s}.log"
            while IFS= read -r line; do
              sc=$(printf '%s' "$line" | sed -n 's/^BEST[[:space:]]\+\([^ ]*\).*/\1/p')
              al=$(printf '%s' "$line" | sed -n 's/.*allocs=\([0-9]*\).*/\1/p')
              if [ -n "${al}" ] && [ "${al}" -gt 0 ]; then
                echo "::error::Allocation audit FAILED: ${sc} con ${al} asignaciones por bloque (invariante 3.1: debe ser 0)"
                FAIL=1
              fi
            done < <(grep '^BEST' "bench_${s}.log")
          done
          if [ "${FAIL}" -eq 0 ]; then
            echo "Allocation audit passed: 0 asignaciones en idle, poly12, poly12_fx4 y max_all"
          else
            echo "::error::Allocation audit fallo en uno o mas escenarios"
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # Benchmark — presupuesto temporal definitivo p95/p99/p999 (§3.3 plan v3.2).
  # Ejecuta los 18 escenarios de carga máxima (3 repeticiones, mejor p95) en un
  # runner dedicado windows-2022 y publica los resultados en la rama
  # `benchmark-results` (se leen via raw.githubusercontent.com para fijar el
  # presupuesto en docs/baseline_fase0_v32.md).
  # ────────────────────────────────────────────────────────────────────────────
  benchmark:
    name: Benchmark — definitive p95/p99/p999 (18 scenarios)
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch JUCE 8.0.12 (no submodule; CMake falls back to ./JUCE)
        shell: bash
        run: |
          if [ ! -d JUCE ]; then
            git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git JUCE
          fi
          echo "JUCE at: $PWD/JUCE"

      - name: Fetch WebView2 SDK (juce_add_plugin exige find_package(WebView2) al configurar)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/wv2/Microsoft.Web.WebView2.1.0.3800.47" | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.3800.47" -OutFile "$env:RUNNER_TEMP/wv2/pkg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/wv2/pkg.zip" -DestinationPath "$env:RUNNER_TEMP/wv2/Microsoft.Web.WebView2.1.0.3800.47" -Force
          Write-Host "WebView2 SDK listo en $env:RUNNER_TEMP/wv2"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Configure CMake (model 2 — Enhanced, full test coverage)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DDEEP_TARGET_MODEL=2 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ runner.temp }}/wv2"

      - name: Build ABDEep_Benchmarks target
        run: |
          cmake --build build --config Release --target ABDEep_Benchmarks

      - name: Run full benchmark (18 scenarios, 3 repeats, best-p95)
        shell: bash
        run: |
          set -o pipefail
          {
            echo "# ABDEep processBlock benchmark — CI windows-2022 (dedicated runner)"
            echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH cpus=$NUMBER_OF_PROCESSORS"
            echo "commit=$(git rev-parse --short HEAD) timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > bench_meta.txt
          ./build/ABDEep_Benchmarks_artefacts/Release/ABDEep_Benchmarks.exe > bench_full.log 2>&1
          echo "benchmark exit=$?"
          grep -E '^(RESULT|BEST|BENCH_DONE)' bench_full.log > bench_results.txt
          grep -q '^BENCH_DONE' bench_full.log || {
            echo "::error::BENCH_DONE no encontrado — benchmark incompleto"
            cat bench_full.log
            exit 1
          }
          echo "::group::Benchmark results"
          cat bench_meta.txt
          cat bench_results.txt
          echo "::endgroup::"
          cat bench_results.txt >> "$GITHUB_STEP_SUMMARY"

      # Publica los resultados como artefacto de Actions (usa el token runtime
      # del runner — sin permisos extra; el push de una rama con .github/workflows/*
      # exigiria workflows:write, que GitHub rechaza en este repo).
      - name: Publish benchmark results (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            bench_meta.txt
            bench_results.txt
            bench_full.log
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # cppcheck CON BASELINE — bloqueante. Deja entrar solo hallazgos NUEVOS:
  # .github/cppcheck-baseline.txt guarda la firma de la deuda medida — severidad|
  # archivo|mensaje, SIN numero de linea y con '/' de separador —, generada midiendo
  # HEAD con ESTE mismo comando y cppcheck 2.21. Bloquean tres cosas: hallazgos
  # fuera de la baseline, la ausencia de la propia baseline, y que la comprobacion
  # no llegue a medirse. El `2>&1` no es opcional: cppcheck escribe los hallazgos
  # en stderr, y medir sin el siempre cuenta 0.
# SUSTITUYE los tres pasos inline `Static analysis (cppcheck)` de los jobs de
# build/benchmark (cppcheck 2.16 en Windows, sin salida capturada y sin baseline, asi
# que sus hallazgos se iban a un log que nadie miraba): un unico gate en Linux con
# baseline, igual que el resto de la familia.
# ALCANCE: Source/. Excluidos por --suppress='*:nombre' (coincidencia por sufijo,
# verificada con cppcheck 2.21): *.gen.* (Source/Core/ParameterConversion.gen.* y
# ParameterRegistry.gen.*) y Source/Core/BuildVersion.h (estampado en cada build).
# JUCE/ (framework vendido) y wasm/ (con su propio pipeline) quedan fuera.
  cppcheck:
    name: cppcheck (bloqueante, baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Cache de cppcheck 2.21.0
      uses: actions/cache@v6
      with:
        path: ~/cppcheck-2.21.0
        key: cppcheck-2.21.0-${{ runner.os }}

    # cppcheck SIN fijar usa la version que traiga la imagen, y la baseline es
    # por firma (severidad|archivo|mensaje): un cppcheck de otra version cambia
    # mensajes y anade/quita hallazgos, y el gate mentiria en las dos direcciones.
    # La unica version aceptada es 2.21.0, con la que se midio la baseline en
    # local. apt no la trae, asi que se compila desde el tag oficial (PCRE es
    # opcional: `make` solo necesita g++/make) y el binario se cachea por
    # version: un cache-miss cuesta ~5 min de compilacion.
    - name: Install cppcheck 2.21.0 (fijado a la version de las baselines)
      shell: bash
      run: |
        v=2.21.0
        pre="$HOME/cppcheck-$v"
        if ! "$pre/bin/cppcheck" --version 2>/dev/null | grep -F "Cppcheck $v" >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make
          src=$(mktemp -d)
          git clone --depth 1 --branch "$v" https://github.com/cppcheck-opensource/cppcheck.git "$src/cppcheck"
          # FILESDIR hace dos cosas a la vez: sin el, el objetivo install del
          # Makefile aborta con "FILESDIR must be set!", y con el compilado el
          # binario sabe donde estan cfg/addons/platforms bajo el prefijo.
          make -C "$src/cppcheck" -j"$(nproc)" FILESDIR="$pre/share/cppcheck"
          make -C "$src/cppcheck" PREFIX="$pre" FILESDIR="$pre/share/cppcheck" install
        fi
        "$pre/bin/cppcheck" --version
        if ! "$pre/bin/cppcheck" --version | grep -F "Cppcheck $v" >/dev/null; then
          echo "::error title=cppcheck::se esperaba cppcheck 2.21.0, la version con la que se midieron las baselines."
          exit 1
        fi
        echo "$pre/bin" >> "$GITHUB_PATH"

    - name: Static analysis (cppcheck) - bloqueante (baseline)
      run: |
        baseline=.github/cppcheck-baseline.txt
        if [ ! -f "$baseline" ]; then
          echo "::error title=cppcheck::no existe $baseline: sin baseline no se puede separar deuda de regresion."
          exit 1
        fi
        # Tolerancia CRLF: si la baseline se commiteo con finales Windows,
        # grep -f no casaria nada y TODO pareceria hallazgo nuevo.
        bl=$(mktemp)
        tr -d '\r' < "$baseline" > "$bl"
        set +e
        salida=$(cppcheck --enable=warning,performance,portability --std=c++20 --suppress=missingIncludeSystem --suppress='*:BuildVersion.h' --suppress='*:*.gen.*' --template='{severity}|{file}|{line}|{message}' Source/ 2>&1)
        codigo=$?
        set -e
        if [ -z "$salida" ]; then
          echo "::error title=cppcheck::cppcheck no ha producido ni una linea (codigo $codigo): la comprobacion no llego a medirse."
          exit 1
        fi
        tmp=$(mktemp)
        printf '%s\n' "$salida" > "$tmp"
        actuales=$(python3 - "$tmp" <<'PY'
        import re, sys
        out = set()
        pat = re.compile(r"^(warning|performance|portability|error)\|([^|]+)\|[^|]+\|(.*)$")
        for ln in open(sys.argv[1], encoding="utf-8", errors="replace"):
            m = pat.match(ln.rstrip("\n"))
            if m:
                out.add(m.group(1) + "|" + m.group(2).replace("\\", "/") + "|" + m.group(3))
        print("\n".join(sorted(out)))
        PY
        )
        rm -f "$tmp"
        nuevos=$(printf '%s\n' "$actuales" | grep -vxF -f "$bl" || true)
        if [ -n "$nuevos" ]; then
          printf '%s\n' "$nuevos" | sed -n '1,30p'
          n=$(printf '%s\n' "$nuevos" | grep -c . || true)
          echo "::error title=cppcheck::${n} hallazgos NUEVOS fuera de la baseline: regresion. Arreglo: atacarlos; solo si es deuda aceptada deliberadamente, anadir su firma a $baseline en el MISMO PR."
          exit 1
        fi
        af=$(mktemp)
        printf '%s\n' "$actuales" > "$af"
        obsoletas=$(grep -v '^#' "$bl" | grep -vxF -f "$af" | grep -c . || true)
        rm -f "$af"
        if [ "$obsoletas" -gt 0 ]; then
          echo "::notice title=cppcheck::${obsoletas} firmas de la baseline ya no aparecen: deuda pagada — prune $baseline."
        fi
        echo "::notice title=cppcheck::sin hallazgos nuevos ($(grep -cv '^#' "$bl") firmas baseladas, ${obsoletas} obsoletas)."
        rm -f "$bl"
        exit 0

  # ---------------------------------------------------------------------------
  # FORMATO (clang-format) — BLOQUEANTE CON BASELINE desde 2026-10-13.
  #
  # SUSTITUYE los tres pasos inline informativos de los jobs de build/benchmark
  # (clang-format de la imagen en Windows, sin baseline): un unico gate en
  # Linux con clang-format 18.* via pip, igual que el resto de la familia.
  # ALCANCE: Source/ (mismo `git ls-files` de siempre). DEUDA MEDIDA en local
  # con clang-format 18.1.8: 243 de 245 ficheros con avisos; la baseline la
  # congela y solo bloquean ficheros NUEVOS con deuda. La firma es POR FICHERO
  # (fichero|mensaje) porque el mensaje de clang-format es generico y linea/col
  # se mueven al editar; cada fichero re-formateado solo genera el aviso de
  # prune.
  clang-format:
    name: Clang-format (estilo C++, bloqueante con baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Install clang-format 18+
      run: |
        pip install clang-format==18.*
        command -v clang-format
        clang-format --version

    - name: Check formatting (clang-format) - bloqueante (baseline)
      shell: bash
      run: |
        baseline=.github/clang-format-baseline.txt
        if [ ! -f "$baseline" ]; then
          echo "::error title=clang-format::no existe $baseline: sin baseline no se puede separar deuda de regresion."
          exit 1
        fi
        # Tolerancia CRLF: si la baseline se commiteo con finales Windows,
        # grep -f no casaria nada y TODO pareceria fichero nuevo.
        bl=$(mktemp)
        tr -d '\r' < "$baseline" > "$bl"
        mapfile -t ficheros < <(git ls-files 'Source/*.h' 'Source/*.cpp' 'Source/*.hpp' 'Source/*.mm')
        set +e
        printf '%s\0' "${ficheros[@]}" | xargs -0 clang-format --dry-run --Werror > "$RUNNER_TEMP/fmt.log" 2>&1
        codigo=$?
        set -e
        avisos=$(grep -c 'code should be clang-formatted' "$RUNNER_TEMP/fmt.log" || true)
        # Un clang-format que sale con != 0 SIN ningun aviso no es deuda: es
        # que la comprobacion no llego a hacerse. Eso SI bloquea.
        if [ "$codigo" -ne 0 ] && [ "$avisos" -eq 0 ]; then
          echo "::error title=clang-format::clang-format fallo (codigo $codigo) sin reportar ni un aviso: la comprobacion no llego a medirse. Log completo abajo."
          cat "$RUNNER_TEMP/fmt.log"
          exit 1
        fi
        # Firmas: fichero|mensaje, SIN linea/col (se mueven al editar).
        tmp=$(mktemp)
        { grep 'code should be clang-formatted' "$RUNNER_TEMP/fmt.log" || true; } \
          | sed -E 's/^([^:]+):[0-9]+:[0-9]+: [a-z]+: (.*)$/\1|\2/' \
          | sort -u > "$tmp"
        nuevos=$(grep -vxF -f "$bl" "$tmp" || true)
        if [ -n "$nuevos" ]; then
          printf '%s\n' "$nuevos" | sed -n '1,30p'
          n=$(printf '%s\n' "$nuevos" | grep -c . || true)
          echo "::error title=clang-format::${n} ficheros NUEVOS con deuda de formato fuera de la baseline: regresion. Arreglo: clang-format-18 -i sobre los ficheros nombrados; solo si es deuda aceptada deliberadamente, anadir su firma a $baseline en el MISMO PR."
          exit 1
        fi
        af=$(mktemp)
        cp "$tmp" "$af"
        obsoletas=$(grep -v '^#' "$bl" | grep -vxF -f "$af" | grep -c . || true)
        rm -f "$af" "$tmp"
        if [ "$obsoletas" -gt 0 ]; then
          echo "::notice title=clang-format::${obsoletas} ficheros de la baseline ya no tienen deuda: deuda pagada — prune $baseline."
        fi
        echo "::notice title=clang-format::sin ficheros nuevos con deuda de formato ($(grep -cv '^#' "$bl") ficheros baselados, ${obsoletas} ya pagados)."
        rm -f "$bl"
        exit 0
