name: Property Fuzzing CI

# property-fuzzing (Fase 7 del plan v3.2 §5) — Property-Based Testing / Fuzzing
# acotado en CI. Ejecuta fuzzRoundTrip (WebUI/js/roundtrip_equality.js) con varios
# seeds deterministas y el registro canónico real (registry.gen.js), y FALLA si hay
# violaciones de propiedad (codec_invariance / codec_payload_bound / codec_throws /
# decode_encode_stability). Los timeouts (dependientes del reloj de pared, no
# deterministas) se reportan como warning y no rompen el job.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fuzz_roundtrip.js"
      - "WebUI/js/roundtrip_equality.js"
      - "WebUI/js/browser_packer.js"
      - "WebUI/js/registry.gen.js"
      - "schemas/**"
      - "WebUI/tests/roundtripEquality.test.js"
      - "WebUI/tests/fuzzRoundtripScript.test.js"
      - ".github/workflows/property-fuzzing.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/fuzz_roundtrip.js"
      - "WebUI/js/roundtrip_equality.js"
      - "WebUI/js/browser_packer.js"
      - "WebUI/js/registry.gen.js"
      - "schemas/**"
      - "WebUI/tests/roundtripEquality.test.js"
      - "WebUI/tests/fuzzRoundtripScript.test.js"
      - ".github/workflows/property-fuzzing.yml"

permissions:
  contents: read

concurrency:
  group: property-fuzzing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property-fuzzing:
    name: fuzzRoundTrip multi-seed (deterministic invariants must hold)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run property fuzzing (fuzzRoundTrip, deterministic seeds)
        run: |
          # `if ! cmd` (patrón establecido): los comandos en condiciones están
          # exentos del `set -e` por defecto de GH Actions, así que los ::error::
          # del script sí se imprimen y el exit 1 marca el fallo del job.
          if ! node scripts/fuzz_roundtrip.js --json; then
            echo "::error::property-fuzzing — violaciones de propiedad detectadas (ver reporte)."
            exit 1
          fi
          echo "OK — sin violaciones de propiedad en los seeds deterministas."
