name: WebUI CI

on:
  workflow_dispatch:
    inputs:
      export_calibration:
        description: "Generate and upload Calibration Lab artifacts"
        required: false
        default: "true"
  pull_request:
  push:
    branches:
      - main
    paths:
      - "WebUI/**"
      - "docs/**"
      - "package.json"
      - ".github/workflows/webui-ci.yml"

permissions:
  contents: read

concurrency:
  group: webui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-export:
    name: Test WebUI and export calibration artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      CALIBRATION_INPUT_DIR: WebUI/tmp/calibration-exports
      CALIBRATION_OUTPUT_DIR: artifacts/calibration-runs
      CALIBRATION_RUN_ID: ${{ github.run_id }}

    # Todos los pasos de shell corren dentro de ABDEep; los paquetes compartidos
    # quedan como hermanos suyos (ver el layout de los checkouts).
    defaults:
      run:
        working-directory: ABDEep

    steps:
      # ── Layout del monorepo ────────────────────────────────────────────────
      # WebUI/js y los tests importan @abdsynths/shared y @abdsynths/midi-keyb,
      # declarados como "workspace:*". Esos paquetes NO estan publicados en
      # ningun registry: solo existen como hermanos dentro del workspace pnpm de
      # la suite (en local, node_modules/@abdsynths/* son symlinks a ../).
      # Sin ellos `pnpm install` no resuelve nada y no hay WebUI que testear.
      # La accion vive en ABDSharedCode y es la MISMA que usa ABDMS2000; ya
      # omite la descarga del Chromium de puppeteer (input con default true).
      - name: Bootstrap pnpm workspace (multi-repo)
        uses: ajabadia/ABDSharedCode/.github/actions/pnpm-workspace-bootstrap@master
        with:
          project: ABDEep

      - name: Run JavaScript lint (zero warnings)
        run: pnpm run lint

      - name: Run full Vitest suite
        run: pnpm test

      - name: Verify WebUI serves correctly
        run: |
          cd WebUI
          python3 -m http.server 8080 &
          SERVER_PID=$!
          sleep 2
          curl -sf http://localhost:8080/index.html > /dev/null && echo "WebUI serves OK"
          curl -sf http://localhost:8080/js/calibration_store.js > /dev/null && echo "JS assets serve OK"
          kill $SERVER_PID 2>/dev/null || true

      - name: Prepare calibration directories
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.export_calibration == 'true')
        run: |
          mkdir -p "${CALIBRATION_INPUT_DIR}"
          mkdir -p "${CALIBRATION_OUTPUT_DIR}"

      - name: Check for calibration inputs
        id: check_cal_inputs
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.export_calibration == 'true')
        run: |
          if [ -d "${CALIBRATION_INPUT_DIR}" ] && [ -n "$(ls -A ${CALIBRATION_INPUT_DIR} 2>/dev/null)" ]; then
            echo "has_inputs=true" >> "$GITHUB_OUTPUT"
            echo "Calibration inputs detected: $(ls -A ${CALIBRATION_INPUT_DIR} | wc -l) files"
          else
            echo "has_inputs=false" >> "$GITHUB_OUTPUT"
            echo "No calibration inputs on CI (esperado en checkout limpio) — export omitido"
          fi

      - name: Export Calibration Lab reports
        if: steps.check_cal_inputs.outputs.has_inputs == 'true'
        run: >
          pnpm run calibration:export:ci --
          --input-dir "${CALIBRATION_INPUT_DIR}"
          --output-dir "${CALIBRATION_OUTPUT_DIR}"
          --run-id "${CALIBRATION_RUN_ID}"

      - name: Verify calibration artifact contents
        if: steps.check_cal_inputs.outputs.has_inputs == 'true'
        run: |
          test -d "${CALIBRATION_OUTPUT_DIR}"
          find "${CALIBRATION_OUTPUT_DIR}" -maxdepth 2 -type f | sort
          test -f "${CALIBRATION_OUTPUT_DIR}/manifest.json"

      # upload-artifact resuelve rutas desde la raiz del workspace, no desde el
      # working-directory del job: por eso van con el prefijo ABDEep/.
      - name: Upload calibration artifact bundle
        if: steps.check_cal_inputs.outputs.has_inputs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calibration-runs-${{ github.run_id }}
          path: ABDEep/artifacts/calibration-runs/
          if-no-files-found: error
          retention-days: 14

      # ── Phase 5: Audio A/B Validation CI verification ──
      - name: Verify Audio A/B outputs & manifest structure
        if: always()
        run: |
          if [ -d "artifacts/audio-ab" ]; then
            echo "Verificando artefactos de Audio A/B generados durante las pruebas..."
            find artifacts/audio-ab -type f | sort
          else
            echo "No se generaron corridas de Audio A/B fisicas en el entorno headless de CI (esperado)."
          fi

      - name: Upload Audio A/B artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: audio-ab-runs-${{ github.run_id }}
          path: ABDEep/artifacts/audio-ab/
          if-no-files-found: ignore
          retention-days: 14
